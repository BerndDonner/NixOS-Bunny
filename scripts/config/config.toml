# ============================================================================
# MCT VM configuration
#
# mct-vm.py deliberately has no command-line options. Persistent settings and
# temporary run controls live here. The normal pipeline is:
#
#   ./scripts/mct-vm.py config-check
#   ./scripts/mct-vm.py generate-hosts
#   ./scripts/mct-vm.py build-golden
#   # manual work in the visible golden VM; shut it down cleanly
#   ./scripts/mct-vm.py finalize-golden
#   ./scripts/mct-vm.py build-vms
#   ./scripts/mct-vm.py build-rollout-images
#   ./scripts/mct-vm.py stage-rollout
#   ./scripts/mct-vm.py rollout
#
# Explicit reset commands remove artifacts but NEVER rebuild them:
#   reset-golden
#   reset-finalized-golden
#   reset-vms
#   reset-rollout-images
#
# Relative paths are resolved from the repository root.
# ============================================================================

[workflow]
# Exactly one image family is active at a time.
# "classroom" uses scripts/config/rollout.csv and bunnyXX.* images.
# "lockdown"  uses scripts/config/rollout-lockdown.csv and bunnyXX-lockdown.* images.
mode = "classroom"

[paths]
# Directory containing golden images. Derived Bunny artifacts are placed in
# a subdirectory named after the active golden image, e.g.
# ~/VirtualMashines/golden-26.05/bunny02.qcow2.
vm_images_dir = "~/VirtualMashines"

# Runtime logs written by VM/golden preparation and rollout.
logs_dir = "logs"

[golden_image]
# Stable name of the valuable manually prepared golden image. mct-vm derives:
#   golden-26.05.building.qcow2   - current build/manual-work image
#   golden-26.05.finalizing.qcow2 - disposable finalization copy
#   golden-26.05.finalized.qcow2  - immutable source for build-vms
# and matching *.OVMF_VARS.fd files automatically.
file = "golden-26.05.qcow2"

# Optional tree overlaid onto /home/student during build-golden.
student_home_content = "~/VirtualMashines/bunny-files-to-copy"

# Page Chromium opens in the finalized golden image. Installed as managed policy
# only on the .finalizing copy, never on the protected manual golden itself.
browser_start_page = "~/reference/www.arduino.cc/en/Reference/HomePage.html"

[provisioning]
# Private SSH key used while mct-vm builds golden/per-student images. The public
# half is versioned as assets/ssh/mct-vm-setup.pub.
preparation_host_key = "~/.ssh/mct-vm-setup"

[images]
# Ask the guest filesystems to release unused blocks before successful shutdown.
optimize_image_size = true

[courses]
# Local classroom repository used as the exact bootstrap source.
# {repo}=MCT_<course>; {course} is also available. The repository must be
# committed and clean; build-vms transfers it via a local git bundle.
source = "repos/{repo}"

# Classroom Forgejo remote configured as origin. No credentials are used during
# image building; student branches are first published later with git pub.
student_origin = "https://forgejo.meisterk.de/Microcontrollertechnik/{repo}.git"

[forgejo]
# Forgejo endpoint used for per-student exam repositories. Students use HTTPS only.
host = "forgejo.meisterk.de"
exam_owner = "donner"

[lockdown]
# Local, independent Git repository copied into lockdown images via git bundle.
# Keep repos/ ignored by the outer NixOS-Bunny repository. The exact exam state
# must be committed and clean before build-vms accepts it.
repo = "repos/MCT-Schulaufgabe1"

[rollout]
# Directory containing finished .vmdk.zst + .sha256 pairs when rollout runs.
prepared_images_dir = "images"

# Dedicated directory on the mounted rollout SSD. stage-rollout replaces its
# generated image set and copies the tooling, but excludes private repos/.
staging_dir = "/run/media/bernd/Extreme SSD/rollout_2627_1"

# Target directory on the Windows classroom PCs.
windows_vm_directory = 'C:\Virtual_Machines'


# ============================================================================
# TEMPORARY RUN CONTROL
# ============================================================================

[run]
# Select rows for build-vms, build-rollout-images and the corresponding reset
# commands. Matching is case-insensitive against CSV fields and full-name words.
vms_include = ["*"]
vms_exclude = []

# Separate selectors used only by Windows rollout.
rollout_include = ["*"]
rollout_exclude = []

# Show/validate planned work without modifying images, SSD staging or PCs.
dry_run = false

# If build-golden, finalize-golden or build-vms fails, leave QEMU running for
# diagnosis instead of stopping it automatically.
keep_failed_vm_running = false

# Force rollout even when the target marker says the compressed image is current.
redeploy_even_if_current = false

# Produce additional diagnostic logging during rollout.
extra_diagnostics = false

# Emergency rollout: prioritize a startable VMDK and do not claim normal remote
# verification. A manifest is written for traceability.
rollout_without_verification = false
